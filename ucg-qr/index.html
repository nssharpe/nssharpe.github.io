        :root {
            /* UCG 2026 palette */
            --ucg-navy: #1e2b38;
            --ucg-navy-deep: #141e27;
            --ucg-blue-green: #a5c8cf;
            --ucg-light-blue: #dbebee;
            --ucg-dark-blue-green: #184b56;
            --ucg-dark-blue-green-deep: #123a43;
            --ucg-red-orange: #f4694a;
            --ucg-border: #bfd5d9;

            --fg: var(--ucg-navy);
            --fg-soft: #4a5a66;
            --surface: #ffffff;
            --page: var(--ucg-light-blue);

            --font-display: 'Greed Condensed', 'Arial Narrow', sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            color: var(--fg);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            padding: 30px;
            background-color: var(--page);
            min-height: 100vh;
            flex-wrap: wrap;
            margin: 0;
        }

        .container {
            background: var(--surface);
            padding: 30px;
            border-radius: 14px;
            border: 1px solid var(--ucg-border);
            box-shadow: 0 10px 30px rgba(30, 43, 56, 0.10);
            width: 100%;
            max-width: 420px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }
        .brand img {
            width: 44px;
            height: 44px;
            display: block;
            flex: none;
        }
        h1 {
            font-family: var(--font-display);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.01em;
            color: var(--ucg-navy);
            font-size: 1.7rem;
            line-height: 1.05;
            margin: 0;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--ucg-dark-blue-green);
            font-size: 0.82rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--ucg-border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--ucg-navy);
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus, input[type="url"]:focus {
            outline: none;
            border-color: var(--ucg-dark-blue-green);
            box-shadow: 0 0 0 3px rgba(24, 75, 86, 0.18);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
            color: var(--ucg-navy);
            text-transform: none;
            letter-spacing: 0;
            font-size: 0.95rem;
            margin-bottom: 0;
        }
        input[type="checkbox"] {
            height: 1.2em;
            width: 1.2em;
            margin-right: 10px;
            accent-color: var(--ucg-dark-blue-green);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--ucg-dark-blue-green);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover { background-color: var(--ucg-dark-blue-green-deep); }
        button:active { transform: scale(0.985); }

        button.secondary {
            background-color: #ffffff;
            color: var(--ucg-dark-blue-green);
            border: 2px solid var(--ucg-dark-blue-green);
        }
        button.secondary:hover {
            background-color: var(--ucg-light-blue);
            color: var(--ucg-navy-deep);
        }

        #border-options {
            display: none;
            padding-left: 15px;
            border-left: 3px solid var(--ucg-blue-green);
            margin-top: 20px;
        }

        #qr-preview-container {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 14px;
        }

        #canvas {
            width: 100%;
            background: #fff;
            border: 1px solid var(--ucg-border);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 220px;
        }
        #canvas:empty::before {
            content: "QR code preview";
            color: var(--fg-soft);
            font-size: 0.95rem;
            text-align: center;
        }
        #canvas > canvas, #canvas > svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .actions { display: none; flex-direction: column; gap: 10px; }

        .hint {
            font-size: 0.8rem;
            color: var(--fg-soft);
            line-height: 1.5;
            margin: 0;
        }
        .hint strong { color: var(--ucg-dark-blue-green); }

        /* Scannability status. Colour pairs are checked against WCAG AA:
           #184b56 on #dbebee = 7.9:1, #8c3418 on #fde3dd = 6.6:1. */
        .status {
            display: none;
            font-size: 0.82rem;
            line-height: 1.45;
            margin: 0;
            padding: 10px 12px;
            border-radius: 8px;
            background: var(--ucg-light-blue);
            color: var(--ucg-dark-blue-green);
        }
        .status.is-visible { display: block; }
        .status.is-warning {
            background: #fde3dd;
            color: #8c3418;
        }
        .status.is-checking { color: var(--fg-soft); background: #f1f5f6; }
    </style>
</head>

        // The <img>-rasterised SVG cannot reach the page's @font-face, so the
        // face is repeated inside every SVG we generate.
        const svgFontFace = `@font-face{font-family:'${UCG.fontFamily}';src:url(${FONT_DATA_URL}) format('woff2');font-weight:700;font-style:normal;}`;

        const escapeXml = (s) => s
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

        const debounce = (fn, delay = 150) => {
            let t = null;
            return (...args) => {
                if (t) clearTimeout(t);
                t = setTimeout(() => fn(...args), delay);
            };
        };

        const downloadText = (text, fileName, mimeType = 'image/svg+xml') => {
            const blob = new Blob([text], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        };

        const downloadSvgAsPng = (svgText, fileName, width, height) => {
            const svgUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgText)}`;
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = UCG.paper;
                ctx.fillRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = `${fileName}.png`;
                document.body.appendChild(a);
                a.click();
                a.remove();
            };
            img.onerror = () => {
                if (qrCode) {
                    browserUtils.download(qrCode, { name: fileName, extension: 'png' }, { width, height });
                }
            };
            img.src = svgUrl;
        };

                    colorStops: [
                        { offset: 0, color: UCG.lightBlue },
                        { offset: GRADIENT_MID_OFFSET, color: GRADIENT_MID },
                        { offset: 1, color: UCG.navy }
                    ]
                }
            },
            backgroundOptions: { round: BACKGROUND_ROUND, color: UCG.paper },
            cornersSquareOptions: { type: 'inpoint', color: UCG.darkBlueGreen },
            cornersDotOptions: { type: 'inpoint', color: UCG.darkBlueGreen }
        });

        /* ------------------------ scannability check ----------------------
           jsQR is loaded lazily; if it can't be fetched the generator still
           works, it just stops vouching for the result. */
        let jsQRPromise = null;
        const getDecoder = () => {
            if (!jsQRPromise) {
                jsQRPromise = import('https://esm.sh/jsqr@1.4.0')
                    .then((m) => m.default)
                    .catch(() => null);
            }
            return jsQRPromise;
        };

        const decodesTo = async (svgText, expected) => {
            const jsQR = await getDecoder();
            if (!jsQR) return null;                 // unknown, not a failure
            const img = new Image();
            img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgText)}`;
            try {
                await img.decode();
            } catch (e) {
                return null;
            }
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = VERIFY_PX;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.fillStyle = UCG.paper;
            ctx.fillRect(0, 0, VERIFY_PX, VERIFY_PX);
            ctx.drawImage(img, 0, 0, VERIFY_PX, VERIFY_PX);
            const { data } = ctx.getImageData(0, 0, VERIFY_PX, VERIFY_PX);
            const res = jsQR(data, VERIFY_PX, VERIFY_PX, { inversionAttempts: 'dontInvert' });
            return !!res && res.data === expected;
        };

        // Cached per URL: the border text has no bearing on the QR itself.
        const fitCache = new Map();

        const fitLogoToUrl = async (url) => {
            if (fitCache.has(url)) return fitCache.get(url);

            let result = null;
            for (const imageSize of IMAGE_SIZE_STEPS) {
                const svg = await new QRCodeStyling(buildQrOptions(url, imageSize)).serialize();
                const ok = await decodesTo(svg, url);
                if (ok === null) {                  // decoder unavailable
                    result = { svg, imageSize, status: 'unverified' };
                    break;
                }
                if (ok) {
                    result = {
                        svg,
                        imageSize,
                        status: imageSize === IMAGE_SIZE_STEPS[0] ? 'ok' : 'reduced'
                    };
                    break;
                }
            }
            if (!result) {
                const imageSize = IMAGE_SIZE_STEPS[IMAGE_SIZE_STEPS.length - 1];
                const svg = await new QRCodeStyling(buildQrOptions(url, imageSize)).serialize();
                result = { svg, imageSize, status: 'failed' };
            }

            fitCache.set(url, result);
            return result;
        };

        const statusEl = document.getElementById('status');
        const setStatus = (text, kind) => {
            statusEl.textContent = text;
            statusEl.className = `status is-visible${kind ? ` is-${kind}` : ''}`;
        };

        const reportFit = (fit) => {
            const pct = Math.round(fit.imageSize * 100);
            switch (fit.status) {
                case 'ok':
                    setStatus(`Checked — this code scans with the logo at ${pct}%.`);
                    break;
                case 'reduced':
                    setStatus(`This URL is long, so the logo was reduced to ${pct}% to keep the code scannable. Shorten the URL to get the logo back to 60%.`);
                    break;
                case 'failed':
                    setStatus('This URL is too long to encode reliably behind the logo. Shorten it or use a link shortener, then test the download on a phone before printing.', 'warning');
                    break;
                default:
                    setStatus('Scannability check unavailable offline — test the download on a phone before printing.', 'checking');
            }
        };

        /* Fit the label to the band, measuring with the real display face. */
        const fitLabel = (ctx, topText, bottomText) => {
            const base = 120;
            const maxWidth = QR_SIZE + 2 * BAND - 2 * (BAND / 2);
            ctx.font = `700 ${base}px "${UCG.fontFamily}"`;
            const widest = Math.max(
                ctx.measureText(topText).width,
                ctx.measureText(bottomText).width,
                1
            );
            let size = widest > maxWidth
                ? Math.max(24, Math.floor(base * (maxWidth / widest)))
                : base;
            if (size > 132) size = 132;

            // Cap height for the fitted size, so all-caps text centres optically.
            ctx.font = `700 ${size}px "${UCG.fontFamily}"`;
            const probe = ctx.measureText((topText || bottomText || 'H'));
            const ascent = probe.actualBoundingBoxAscent || size * 0.72;
            return { size, ascent };
        };

        const generateQrCode = async () => {
            const url = urlInput.value.trim();
            if (!url) {
                canvasDiv.replaceChildren();
                actions.style.display = 'none';
                statusEl.className = 'status';
                return;
            }

            const token = ++renderToken;
            if (!fitCache.has(url)) setStatus('Checking that this code scans…', 'checking');

            const fit = await fitLogoToUrl(url);
            if (token !== renderToken) return;   // a newer keystroke won

            qrCode = new QRCodeStyling(buildQrOptions(url, fit.imageSize));
            const qrSvg = fit.svg;
            reportFit(fit);

            if (!borderCheckbox.checked) {
                // Bare QR: still routed through our own wrapper so the preview
                // and the export come from exactly the same markup.
                const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${QR_SIZE}" height="${QR_SIZE}" viewBox="0 0 ${QR_SIZE} ${QR_SIZE}">
  <rect x="0" y="0" width="${QR_SIZE}" height="${QR_SIZE}" fill="${UCG.paper}"/>
  <image x="0" y="0" width="${QR_SIZE}" height="${QR_SIZE}" href="data:image/svg+xml;utf8,${encodeURIComponent(qrSvg)}"/>
</svg>`;
                showResult(svg, QR_SIZE, QR_SIZE);
                return;
            }

            const topText = (topTextInput.value || '').toUpperCase();
            const bottomText = (bottomTextInput.value || '').toUpperCase();

            const totalWidth = QR_SIZE + BAND * 2;
            const totalHeight = QR_SIZE + BAND * 2;
            const qrX = BAND;
            const qrY = BAND;

            const ctx = document.createElement('canvas').getContext('2d');
            const { size: fontSize, ascent } = fitLabel(ctx, topText, bottomText);

            // Frame stroke path, concentric with the QR's rounded corner.
            const frameX = qrX - FRAME_GAP - INNER_STROKE / 2;
            const frameY = qrY - FRAME_GAP - INNER_STROKE / 2;
            const frameSide = QR_SIZE + 2 * (FRAME_GAP + INNER_STROKE / 2);

            const topBaseline = BAND / 2 + ascent / 2;
            const bottomBaseline = totalHeight - BAND / 2 + ascent / 2;

            const qrDataUrl = `data:image/svg+xml;utf8,${encodeURIComponent(qrSvg)}`;

            const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${totalWidth}" height="${totalHeight}" viewBox="0 0 ${totalWidth} ${totalHeight}">
  <defs>
    <style type="text/css">${svgFontFace}</style>
  </defs>
  <rect x="0" y="0" width="${totalWidth}" height="${totalHeight}" fill="${UCG.paper}"/>
  <rect x="${OUTER_STROKE / 2}" y="${OUTER_STROKE / 2}" width="${totalWidth - OUTER_STROKE}" height="${totalHeight - OUTER_STROKE}" rx="${OUTER_RADIUS}" ry="${OUTER_RADIUS}" fill="none" stroke="${UCG.frame}" stroke-width="${OUTER_STROKE}"/>
  <rect x="${frameX}" y="${frameY}" width="${frameSide}" height="${frameSide}" rx="${framePathRadius}" ry="${framePathRadius}" fill="none" stroke="${UCG.frame}" stroke-width="${INNER_STROKE}"/>
  <image x="${qrX}" y="${qrY}" width="${QR_SIZE}" height="${QR_SIZE}" href="${qrDataUrl}"/>
  <text x="${totalWidth / 2}" y="${topBaseline}" text-anchor="middle" font-family="${UCG.fontFamily}" font-weight="700" font-size="${fontSize}" fill="${UCG.frame}">${escapeXml(topText)}</text>
  <text x="${totalWidth / 2}" y="${bottomBaseline}" text-anchor="middle" font-family="${UCG.fontFamily}" font-weight="700" font-size="${fontSize}" fill="${UCG.frame}">${escapeXml(bottomText)}</text>
</svg>`;

            showResult(svg, totalWidth, totalHeight);
        };

        const showResult = (svg, width, height) => {
            lastSvg = svg;
            lastSize = { width, height };
            const parsed = new DOMParser().parseFromString(svg, 'image/svg+xml').documentElement;
            canvasDiv.replaceChildren(parsed);
            actions.style.display = 'flex';
        };

        downloadBtn.addEventListener('click', () => {
            if (!lastSvg) return;
            downloadSvgAsPng(lastSvg, fileNameFor(), lastSize.width, lastSize.height);
        });
        downloadSvgBtn.addEventListener('click', () => {
            if (!lastSvg) return;
            downloadText(lastSvg, `${fileNameFor()}.svg`);
        });

        const toggleBorderOptions = () => {
            borderOptionsDiv.style.display = borderCheckbox.checked ? 'block' : 'none';
        };

        const scheduleRender = debounce(() => { generateQrCode(); });
        urlInput.addEventListener('input', scheduleRender);
        topTextInput.addEventListener('input', scheduleRender);
        bottomTextInput.addEventListener('input', scheduleRender);
        borderCheckbox.addEventListener('change', () => {
            toggleBorderOptions();
            scheduleRender();
        });

        // Expose for the automated contrast/scan checks.
        window.__ucgQr = {
            get svg() { return lastSvg; },
            get size() { return lastSize; },
            buildQrOptions,
            regenerate: generateQrCode,
            constants: { UCG, GRADIENT_MID, GRADIENT_MID_OFFSET, QR_SIZE, BAND, qrCornerRadius, frameInnerRadius, framePathRadius }
        };

        const start = async () => {
            toggleBorderOptions();
            // The label autosizer measures with canvas 2D, which silently falls
            // back to a default face unless the font is actually loaded first.
            try {
                await document.fonts.load(`700 120px "${UCG.fontFamily}"`);
                await document.fonts.ready;
            } catch (e) { /* fall through with metric fallback */ }
            await generateQrCode();
            document.body.dataset.ready = '1';
        };
        start();
    </script>
</body>
</html>
